name: Test with multiple Zod versions

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - main_v1
  push:
    branches:
      - main
      - main_v1

jobs:
  compatibility_test_v1:
    if: github.base_ref == 'main_v1' || github.ref_name == 'main_v1'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zod-version: ['3.22.3', '3.23.0', '3.24.0', '3.25.1', '^3.25.76']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zod @ ${{ matrix.zod-version }}
        run: npm install zod@${{ matrix.zod-version }}

      - name: Install other dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm test

  compatibility_test:
    if: github.base_ref == 'main' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zod-version: ['3.25.28', 'latest']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zod @ ${{ matrix.zod-version }}
        run: npm install zod@${{ matrix.zod-version }}

      - name: Install other dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm test