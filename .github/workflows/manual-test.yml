name: Run Tests Manually

on:
  workflow_dispatch:

jobs:
  manual_testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:cpp
