name: Release

# Manual release. Merging PRs to main / main_v1 releases nothing; the version and notes
# are derived from the Conventional Commit titles (fix / feat / type!) merged since the
# last release. Run this workflow from the Actions tab ("Run workflow", choosing main or
# main_v1 as the branch) when you want to release.
#
# Steps: generate changesets from commits -> `changeset version` -> commit + tag to the
# branch -> npm publish -> GitHub release. If a run fails after pushing the release
# commit, run it again: with nothing pending it publishes the current version if npm
# doesn't have it.

on:
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        if: github.ref_name == 'main' || github.ref_name == 'main_v1'
        runs-on: ubuntu-latest
        env:
            # main publishes as npm `latest`; main_v1 (Zod 3) as `latestV1`.
            NPM_TAG: ${{ github.ref_name == 'main' && 'latest' || 'latestV1' }}
            GH_LATEST: ${{ github.ref_name == 'main' && 'true' || 'false' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
            - run: npm ci
            - run: npm run build
            - run: npm test

            # Build changesets from the Conventional Commit subjects (fix -> patch,
            # feat -> minor, type! -> major) merged since the last `chore(release)` commit.
            # No per-PR changeset files needed; the files stay uncommitted and are consumed
            # by `changeset version` below.
            - name: Generate changesets from commits
              run: node scripts/commits-to-changesets.mjs

            - name: Check pending changesets
              id: pending
              run: |
                  COUNT=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
                  echo "count=$COUNT" >> "$GITHUB_OUTPUT"
                  if [ "$COUNT" -eq 0 ]; then
                      NAME=$(node -p "require('./package.json').name")
                      VERSION=$(node -p "require('./package.json').version")
                      if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
                          echo "::error::No pending changesets and $NAME@$VERSION is already on npm. Nothing to release."
                          exit 1
                      fi
                      echo "No pending changesets; $NAME@$VERSION is not on npm yet, publishing it."
                  else
                      echo "Pending changesets ($COUNT):"
                      find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
                  fi

            # Bumps package.json, updates CHANGELOG.md and package-lock.json, deletes the
            # consumed changesets. Commit + tag are pushed atomically; if the branch moved
            # during the run the push is rejected and nothing is published.
            - name: Version, commit and tag
              if: steps.pending.outputs.count != '0'
              run: |
                  npm run version
                  VERSION=$(node -p "require('./package.json').version")
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "chore(release): v$VERSION"
                  git tag "v$VERSION"
                  git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"

            - name: Publish to npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
              run: |
                  NAME=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")
                  if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
                      echo "$NAME@$VERSION is already on npm"
                  else
                      npm publish --access public --tag "$NPM_TAG"
                  fi
                  # Make sure the dist-tag points at this version (also fixes a re-run).
                  npm dist-tag add "$NAME@$VERSION" "$NPM_TAG"

            # Published immediately (not a draft), notes taken from the CHANGELOG entry.
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="v$VERSION"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG already exists"
                      exit 0
                  fi
                  awk -v v="$VERSION" '/^## /{p=($2==v);next} p' CHANGELOG.md > notes.md
                  test -s notes.md || { echo "No changelog entry for $VERSION"; exit 1; }
                  gh release create "$TAG" --title "$TAG" --notes-file notes.md \
                      --target "$(git rev-parse HEAD)" --latest="$GH_LATEST"
