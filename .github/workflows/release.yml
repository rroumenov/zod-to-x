name: Release

on:
    push:
        branches:
            - main
            - main_v1

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
            - run: npm ci
            - run: npm run build
            - run: npm test

            # Derive changesets from fix/feat commits since the last release. Files stay
            # uncommitted; changesets/action consumes them to build the release PR.
            - run: node scripts/commits-to-changesets.mjs

            - uses: changesets/action@v1
              with:
                  version: npm run version
                  publish: ${{ github.ref_name == 'main_v1' && 'npm run release:v1' || 'npm run release' }}
                  commit: "chore(release): version packages"
                  title: "chore(release): version packages"
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

            # Draft a GitHub release for the merged "Version Packages" PR. The tag is
            # created when the draft is published. Runs after a successful publish only.
            - name: Draft GitHub release
              if: startsWith(github.event.head_commit.message, 'chore(release)')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  LATEST: ${{ github.ref_name == 'main_v1' && 'false' || 'true' }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="v$VERSION"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG already exists"
                      exit 0
                  fi
                  awk -v v="$VERSION" '/^## /{p=($2==v);next} p' CHANGELOG.md > notes.md
                  test -s notes.md || { echo "No changelog entry for $VERSION"; exit 1; }
                  gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md \
                      --target "$GITHUB_SHA" --latest="$LATEST"
